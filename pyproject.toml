[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "isotope"
version = "0.1.0"
description = "Application-first personal AI assistant."
requires-python = ">=3.13"
dependencies = []

[project.scripts]
isotope-demo = "isotope.demo:main"
isotope-capability = "isotope.capabilities.runner:main"
isotope-llm-smoke = "isotope.llm_live_smoke:main"
isotope-task = "isotope.features.tasks.runner:main"
isotope-file = "isotope.features.files.runner:main"
isotope-project = "isotope.features.projects.runner:main"
isotope-search = "isotope.features.search.runner:main"
isotope-research = "isotope.features.research.runner:main"
isotope-workbench = "isotope.features.workbench.runner:main"
isotope-ask = "isotope.features.ask.runner:main"
isotope-api = "isotope.apps.api:main"
isotope-supervisor = "isotope.features.supervisor.runner:main"
isotope-notification = "isotope.features.notifications.runner:main"

[project.optional-dependencies]
test = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
